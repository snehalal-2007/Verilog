<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Luna — Stargazing Park</title>

    <!-- theme first: every other stylesheet reads its custom properties -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/scene.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/interface.css') }}">

    <script type="module" src="{{ url_for('static', filename='js/main.js') }}" defer></script>

</head>


<!-- The <body> class is the whole clock: day -> night -> stargaze -->
<body class="day">

<div id="stage">

    <svg id="scene" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice">

        {% include "partials/defs.html" %}

        {% include "partials/sky.html" %}
        {% include "partials/landscape.html" %}

        <g id="zones">
            {% include "partials/parking.html" %}
            {% include "partials/trail.html" %}
            {% include "partials/playground.html" %}
            {% include "partials/stargazing.html" %}
        </g>

        <!-- darkens the park at night, but stops at the horizon so
             the sky and the galaxy keep their own colour -->
        <rect id="nightTint" x="0" y="330" width="1200" height="370"
              fill="url(#tintGrad)" pointer-events="none"/>

        <!-- the four lamp posts are drawn by static/js/lamps.js -->
        <g id="lamps"></g>

    </svg>

    {% include "partials/interface.html" %}

</div>

</body>

</html>
